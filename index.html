<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BarberPro — Escolha seu acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-light: #E8C96B;
  --gold-dark: #A07830;
  --bg: #0D0D0D;
  --bg2: #141414;
  --bg3: #1C1C1C;
  --border: #2A2A2A;
  --text: #F0EDE8;
  --text2: #9A9590;
  --text3: #6A6560;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:26px;
  color:var(--gold);
  margin-bottom:8px;
}
.tagline{
  color:var(--text2);
  font-size:14px;
  margin-bottom:48px;
  text-align:center;
}
.choices{
  display:flex;
  flex-direction:column;
  gap:16px;
  width:100%;
  max-width:400px;
}
.choice-card{
  display:flex;
  align-items:center;
  gap:16px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px 20px;
  text-decoration:none;
  color:var(--text);
  transition:border-color .2s, transform .15s;
}
.choice-card:active{transform:scale(.98)}
.choice-card:hover{border-color:var(--gold)}
.choice-icon{
  font-size:28px;
  width:52px;
  height:52px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg3);
  flex-shrink:0;
}
.choice-text{flex:1}
.choice-title{font-weight:700;font-size:17px;margin-bottom:2px}
.choice-sub{font-size:13px;color:var(--text2)}
.choice-arrow{color:var(--text3);font-size:20px}
.footer-note{
  margin-top:40px;
  font-size:12px;
  color:var(--text3);
  text-align:center;
}
</style>
</head>
<body>

<div class="logo">
  <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
    <path d="M8 4 L8 28 M8 4 Q16 10 24 4 M8 28 Q16 22 24 28" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
    <circle cx="24" cy="16" r="5" stroke="#C9A84C" stroke-width="1.5"/>
    <path d="M19 16 L29 16" stroke="#C9A84C" stroke-width="1.5"/>
  </svg>
  BarberPro
</div>
<div class="tagline">Como você quer acessar?</div>

<div class="choices">
  <a class="choice-card" href="cliente.html">
    <div class="choice-icon">💈</div>
    <div class="choice-text">
      <div class="choice-title">Sou Cliente</div>
      <div class="choice-sub">Agendar um corte ou serviço</div>
    </div>
    <div class="choice-arrow">→</div>
  </a>

  <a class="choice-card" href="admin.html">
    <div class="choice-icon">✂️</div>
    <div class="choice-text">
      <div class="choice-title">Sou Dono da Barbearia</div>
      <div class="choice-sub">Gerenciar agendamentos e clientes</div>
    </div>
    <div class="choice-arrow">→</div>
  </a>
</div>

<div class="footer-note">© 2025 BarberPro. Todos os direitos reservados.</div>

</body>
</html>
